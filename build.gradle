buildscript {
    repositories {
        jcenter()
        mavenCentral()
        maven {
            name = "forge"
            url = "http://files.minecraftforge.net/maven"
        }
        maven { url = "https://repo.spongepowered.org/maven" }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
        classpath 'org.spongepowered:mixingradle:0.6-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'org.spongepowered.mixin'

version = "2.0"
group = "com.dev.statflex"
archivesBaseName = "statflex"

sourceCompatibility = 1.8
targetCompatibility = 1.8

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    mappings = "stable_22"
}

mixin {
    defaultObfuscationEnv notch
    add sourceSets.main, "statflex.refmap.json"
}

repositories {
    mavenCentral()
    maven { url = "https://repo.spongepowered.org/maven" }
}

dependencies {
    compile 'com.google.code.gson:gson:2.8.9'
    compile 'org.spongepowered:mixin:0.7.11-SNAPSHOT'
}

jar {
    manifest.attributes(
            'MixinConfigs': 'statflex.mixins.json',
            'FMLCorePluginContainsFMLMod': 'true',
            'Agent-Class': 'com.konayuki.statflex.StatFlexAgent',
            'Premain-Class': 'com.konayuki.statflex.StatFlexAgent',
            'Can-Redefine-Classes': 'false',
            'Can-Retransform-Classes': 'false'
    )
}

task fatJar(type: Jar) {
    manifest.from jar.manifest
    baseName = "${project.archivesBaseName}"
    classifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from {
        configurations.runtime.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
